<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  
  <style>
    body {
      padding-top: 56px;
    }

    @media (min-width: 992px) {
      .sidebar.offcanvas-lg {
        position: static;
        transform: none;
        visibility: visible !important;
        border-right: 1px solid #dee2e6;
        width: 250px;
      }

      .offcanvas-body {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 56px);
        padding: 1rem;
      }

      .dashboard-wrapper {
        display: flex;
      }

      .main-content {
        flex-grow: 1;
        padding: 1.5rem 2rem;
        min-height: calc(100vh - 56px);
        overflow-y: auto;
      }
    }

    .chart {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .pie-histo {
        display: flex;
        gap: 2rem;
      }

      .bar {
        display: flex;
        gap: 2rem;
      }

      .chart-container-1,
      .chart-container-2 {
        flex: 1;
      }
    }

    .custom-legend .dot {
      height: 12px;
      width: 12px;
      display: inline-block;
      border-radius: 50%;
      margin-right: 5px;
    }

    .dot.on-time { background-color: #4caf50; }
    .dot.late { background-color: #ff9800; }
    .dot.very-late { background-color: #f44336; }
    .top { font-size: 18px; margin-bottom: 10px; }
    
    .dot {
        height: 10px;
        width: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
      }
      .on-time { background-color: #28a745; }
      .late { background-color: #ffc107; }
      .very-late { background-color: #dc3545; }
      .pie-chart-container {
        position: relative;
        width: 100%;
        max-width: 300px;
        height: 300px; /* <- this is important */
        margin: auto;
      }
      
      #deliveryPieChart {
        width: 100% !important;
        height: 100% !important;

      }
      
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
      
       .histo {
        height: 300px;
        width: 50% !important;
      
        }
      .chart-container-1,
.chart-container-2 {
  height: 300px; /* same height as other charts for consistency */
  position: relative;
}

.chart-container-1 canvas,
.chart-container-2 canvas {
  width: 100% !important;
  height: 100% !important;
}

      
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
  <div class="container-fluid">
    <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
      <i class="bi bi-list"></i>
    </button>
    <img src="img/SPRINGFIELD LOGO 1.png" alt="Logo" style="height: 30px; margin-right: 8px;">
  </div>
</nav>

<div class="dashboard-wrapper">
  <!-- Sidebar -->
  <div class="offcanvas offcanvas-start offcanvas-lg sidebar" tabindex="-1" id="sidebar">
    <div class="offcanvas-header d-lg-none">
      <h5 class="offcanvas-title">Navigation</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-house-door me-2"></i>Dashboard</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><img src="img/shipments.png" alt="" style="width: 15px; margin-left: -11px;"> Shipments</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-truck me-2"></i>Drivers</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-receipt me-2"></i>Invoicing</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-chat-dots me-2"></i>Communication</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-bell me-2"></i>Alerts</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-bar-chart-line me-2"></i>Reports</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark " href="#"><i class="bi bi-people me-2"></i>User Management</a></li>
        <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
      </ul>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main-content container-fluid">
    <!-- Header with Search and Admin Info -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div class="input-group" style="max-width: 500px;">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control border-start-0" placeholder="Search..." />
      </div>
      <div class="d-flex align-items-center mt-2 mt-md-0">
        <span class="me-3">Admin User</span>
        <img src="img/notifications.png" class="me-2" style="height: 30px;" />
        <img src="img/Frame 245.png" style="height: 30px;" />
      </div>
    </div>

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5>Reports & Analysis</h5>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm">Assign Driver</button>
        <button class="btn btn-success btn-sm"><i class="bi bi-plus me-1"></i>Create Workflow</button>
      </div>
    </div>

    <!-- Text Navigation -->
    <div class="d-flex flex-wrap gap-4 mb-4">
      <a href="#" class="text-decoration-none text-dark">Operational KPIs</a>
      <a href="#" class="text-decoration-none text-dark">Customer Reports</a>
      <a href="#" class="text-decoration-none text-dark">Cost Analysis</a>
    </div>

    <!-- Chart Section -->
    <div class="chart">
     

      <!-- Bar Charts -->
      <div class="bar">
        <div class="chart-container-1">
          <h6 class="top">Top Clients by Revenue</h6>
          <canvas id="deliveryBarChart" ></canvas>

        </div>
        <div class="chart-container-2">
          <h6 class="top">Customer Comolains Frequency</h6>
          <canvas id="ordersBarChart"></canvas>
        </div>
      </div>

      <div class="histo">
        <h6 class="top">Customer Satisfaction  Trend</h6>
        <canvas id="historicalChart"></canvas>
      </div>
      
    </div>
  </main>
</div>
<!-- Chart JS -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
      // PIE CHART: Delivery Status
      
  
      // BAR CHART: Orders
      const ctx2 = document.getElementById('ordersBarChart').getContext('2d');
      new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: ['Delivered', 'In Transit', 'Delayed', 'Failed'],
          datasets: [{
            label: 'Number of Shipments',
            data: [200, 150, 70, 10],
            backgroundColor: '#82CA9D',
            borderColor: '#dc2626',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              max: 260,
              ticks: { stepSize: 65, color: '#444' }
            },
            x: {
              ticks: { color: '#444' }
            }
          }
        }
      });
  
    


      const ctx3 = document.getElementById('deliveryBarChart').getContext('2d');
      const deliveryBarChart = new Chart(ctx3, {
          type: 'bar',
          data: {
              labels: ['Emmanuel', 'Amina', 'Chinedu', 'Fatima', 'Oluwaseun'],
              datasets: [{
                  label: 'Efficiency %',
                  data: [90, 80, 50, 30, 70],
                  backgroundColor: '#8884D8',
                  borderColor: '#222c41',
              }]
          },
          options: {
              responsive: true,
              scales: {
                  y: {
                      beginAtZero: true,
                      max: 100,
                      ticks: {
                          stepSize: 25,
                      },
                      grid: {
                          borderDash: [2, 2] // 👈 Dotted horizontal lines
                      }
                  },
                  x: {
                      grid: {
                          display: false // Optional: remove vertical lines
                      }
  
                  }
              },
              plugins: {
                  legend: {
                      position: 'bottom',
                      labels: {
                          color: '#8884D8',
                          font: {
                              size: 17
                          },
                          boxWidth: 18,   // 👈 Width of the legend color box
                          boxHeight: 18   // 👈 Height of the legend color box (Chart.js 4+ only)
                      }
                  }
              }
  
          }
      });  

      const ctx4 = document.getElementById('historicalChart').getContext('2d');

      const historicalChart = new Chart(ctx4, {
          type: 'line',
          data: {
              labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
              datasets: [{
                  label: 'Avg. Delivery Time (min)',
                  data: [50, 45, 48, 42, 38, 35],
                  backgroundColor: '#8884D8',
                  borderColor: '#4f46e5',
                  borderWidth: 2,
                  tension: 0.4,
                  pointRadius: 5,
                  pointBackgroundColor: '#4f46e5'
              }]
          },
          options: {
              responsive: true,
              scales: {
                  y: {
                      beginAtZero: true,
                      max: 60,
                      title: {
                          display: true,
                          text: 'Minutes',
                          font: {
                              size: 14
                          }
                      },
                      ticks: {
                          stepSize: 15,
                          color: '#444'
                      },
                      grid: {
                          borderDash: [2, 2]
                      }
                  },
                  x: {
                      ticks: {
                          color: '#444'
                      },
                      grid: {
                          display: false
                      }
                  }
              },
              plugins: {
                  legend: {
                      position: 'bottom',
                      labels: {
                          color: '#8884D8',
                          font: {
                              size: 17
                          },
                          boxWidth: 18,   // 👈 Width of the legend color box
                          boxHeight: 18   // 👈 Height of the legend color box (Chart.js 4+ only)
                      }
                  }
              }
          }
      });




      
    });
    
  </script>
  
</body>
</html>
