<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Modal Background Blur */
    .modal-backdrop.show {
      backdrop-filter: blur(5px);
    }

    .custom-modal .modal-content {
      border-radius: 15px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #000;
    }

        
      </style>
  
</head>
<body>

<!-- Trigger Button -->
<div class="text-center mt-5">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#popupFormModal">
    Open Popup Form
  </button>
</div>

<!-- Modal -->
<div class="modal fade custom-modal" id="popupFormModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-4 position-relative">
      
      <!-- Close Button -->
      <span class="close-btn" data-bs-dismiss="modal">&times;</span>
      
      
      <p>Create New Alert Rule</p>
      <p>Crate a new customer suppoert ticket.Fill out reuired information</p>
      
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Alert Name</label>
          <input type="text" class="form-control" id="name" placeholder="E.g'Delievry Delay Alert '">
        </div>

        
        <div class="mb-3">
            <label for="message" class="form-label">Treigger Event</label>        
            <select name="" id="" class="form-control">
                <option value="">select trigger alert</option>
                <option value="">Medium</option>
                <option value="">High</option>
                
            </select>
            
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Recepient</label>
          
            <div class="d-flex flex-wrap gap-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc1">
                <label class="form-check-label" for="desc1">
                  Customer
                </label>
              </div>
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc2">
                <label class="form-check-label" for="desc2">
                  Driver
                </label>
              </div>
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc3">
                <label class="form-check-label" for="desc3">
                  Dispatcher
                </label>
              </div>
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc4">
                <label class="form-check-label" for="desc4">
                  Operation Manager
                </label>
              </div>
            </div>
          </div>
          
          
          <div class="mb-3">
            <label for="message" class="form-label">Recepient</label>
          
            <div class="d-flex flex-wrap gap-3">
              
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc2">
                <label class="form-check-label" for="desc2">
                  Email
                </label>
              </div>
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc3">
                <label class="form-check-label" for="desc3">
                  SMS
                </label>
              </div>
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc4">
                <label class="form-check-label" for="desc4">
                  App Push
                </label>
              </div>
            </div>
          </div>
           
          <div class="mb-3">
            <label for="message" class="form-label">Active hours</label>
          
            <div class="d-flex flex-wrap gap-3">
              
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc2">
                <label class="form-check-label" for="desc2">
                  Business hours only[8 AM - 5 PM]
                </label>
              </div>
          
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="desc3">
                <label class="form-check-label" for="desc3">
                    24/7
                </label>
              </div>
          
              
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-white w-50 border">Cancel</button>
            <button type="submit" class="btn btn-success w-50">Create Alert</button>
          </div>
          
      </form>
           
     
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
