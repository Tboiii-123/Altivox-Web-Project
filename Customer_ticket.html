<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Modal Background Blur */
    .modal-backdrop.show {
      backdrop-filter: blur(5px);
    }

    .custom-modal .modal-content {
      border-radius: 15px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #000;
    }

        .timeline {
          position: relative;
          margin-left: 20px;
          padding-left: 20px;
          border-left: 2px solid #0d6efd;
        }
    
        .timeline-item {
          position: relative;
          margin-bottom: 25px;
        }
    
        .timeline-item::before {
          content: '';
          position: absolute;
          left: -12px;
          top: 5px;
          width: 12px;
          height: 12px;
          background-color: #0d6efd;
          border-radius: 50%;
          border: 2px solid white;
        }
    
        .ticket-id {
          font-weight: 500;
          color: #0d6efd;
        }
    
        .subtext {
          color: #6c757d;
          font-size: 0.95rem;
        }
      </style>
  
</head>
<body>

<!-- Trigger Button -->
<div class="text-center mt-5">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#popupFormModal">
    Open Popup Form
  </button>
</div>

<!-- Modal -->
<div class="modal fade custom-modal" id="popupFormModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-4 position-relative">
      
      <!-- Close Button -->
      <span class="close-btn" data-bs-dismiss="modal">&times;</span>
      
      
      <p>Create New Ticket</p>
      <p>Crate a new customer suppoert ticket.Fill out reuired information</p>
      
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Customer</label>
          <input type="text" class="form-control" id="name" placeholder="Enter customer name or company">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Shipment ID</label>
          <input type="email" class="form-control" id="email" placeholder="ST-YYY">

        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Issue Type</label>        
          <input type="email" class="form-control" id="email"  placeholder="Delivery,delay damange etc">
          
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Priority</label>        
            <select name="" id="" class="form-control">
                <option value="">Low</option>
                <option value="">Medium</option>
                <option value="">High</option>
                
            </select>
            
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Description</label>        
            <input type="email" class="form-control" id="email"  placeholder="detailed description of the issue">
            
          </div>
          
          


        <button type="submit" class="btn btn-success w-50">Create Ticket</button>
      </form>
           
     
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
