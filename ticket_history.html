<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popup Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Modal Background Blur */
    .modal-backdrop.show {
      backdrop-filter: blur(5px);
    }

    .custom-modal .modal-content {
      border-radius: 15px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #000;
    }

        .timeline {
          position: relative;
          margin-left: 20px;
          padding-left: 20px;
          border-left: 2px solid #0d6efd;
        }
    
        .timeline-item {
          position: relative;
          margin-bottom: 25px;
        }
    
        .timeline-item::before {
          content: '';
          position: absolute;
          left: -12px;
          top: 5px;
          width: 12px;
          height: 12px;
          background-color: #0d6efd;
          border-radius: 50%;
          border: 2px solid white;
        }
    
        .ticket-id {
          font-weight: 500;
          color: #0d6efd;
        }
    
        .subtext {
          color: #6c757d;
          font-size: 0.95rem;
        }
      </style>
  
</head>
<body>

<!-- Trigger Button -->
<div class="text-center mt-5">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#popupFormModal">
    Open Popup Form
  </button>
</div>

<!-- Modal -->
<div class="modal fade custom-modal" id="popupFormModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-4 position-relative">
      
      <!-- Close Button -->
      <span class="close-btn" data-bs-dismiss="modal">&times;</span>
      
      
      <p>Ticketing t-001: Delivery Delay</p>
      <p>Sybmitted by inclined corp on 2025-05-08 9:30am</p>
      
      <div class="d-flex justify-content-between text-center mb-3">
        <div>
          <div class="fw-bold">Shipment</div>
          <div class="text-muted" id="text">st-2023-045</div>
        </div>
        <div>
          <div class="fw-bold">Status</div>
          <div  id="text" style="color: yellow;">open</div>
        </div>
      </div>
      
      <div class="d-flex justify-content-between text-center ">
        <div>
          <div class="fw-bold">Proprity</div>
          <button class="btn btn-danger">High</button>
        </div>
        <div>
          <div class="fw-bold">Status</div>
          <div  id="text" style="color: yellow;">open</div>
        </div>
      </div>
        <hr>
        <div class="container my-5">
            <h5 class="mb-4">Ticket History</h5>
          
            <div class="timeline">
          
              <!-- Item 1 -->
              <div class="timeline-item">
                <div><strong>Ticket Opened</strong></div>
                <div class="ticket-id">20203,67382872</div>
                <div class="subtext">Customer reported issue with delivery delay</div>
              </div>
          
           
          
            </div>
          </div>
            <hr>

            <h5 class="mb-4">Add response</h5>
            <form action="">
                <textarea name="" id="" cols="50" rows="3"></textarea>
                                
                <div class="container my-4">
                    <div class="d-flex flex-wrap gap-3 justify-content-between">
                    <button class="btn btn-white flex-fill border">Assign</button>
                    <button class="btn btn-white flex-fill border">priority</button>
                    <button class="btn btn-white flex-fill border">Resolve</button>
                    <button class="btn btn-success flex-fill border">Submit response</button>
                    </div>
                </div>
            </form>
     
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
