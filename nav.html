<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      padding-top: 56px;
    }

    @media (min-width: 992px) {
      .sidebar.offcanvas-lg {
        position: static;
        transform: none;
        visibility: visible !important;
        border-right: 1px solid #dee2e6;
        width: 250px;
      }

      .offcanvas-body {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 56px);
        padding: 1rem;
      }

      .dashboard-wrapper {
        display: flex;
      }

      .main-content {
        flex-grow: 1;
        padding: 1.5rem 2rem;
        min-height: calc(100vh - 56px);
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container-fluid">
      <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
        <i class="bi bi-list"></i>
      </button>
      <img src="img/SPRINGFIELD LOGO 1.png" alt="" style="height: 30px; margin-right: 8px;">
          
    </div>
  </nav>

  <!-- Page Content -->
  <div class="dashboard-wrapper mt-lg-0 mt-4">

    <!-- Sidebar -->
    <div class="offcanvas offcanvas-start offcanvas-lg sidebar" tabindex="-1" id="sidebar">
      <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title">Navigation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="nav flex-column">
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-house-door me-2"></i>Dashboard</a></li>
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="me-2"></i> <img src="img/shipments.png" alt="" style="width: 15px; margin-left: -11px;">
            Shipments</a></li>
          
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-truck me-2"></i>Drivers</a></li>
          
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-receipt me-2"></i>Invoicing</a></li>
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-chat-dots me-2"></i>Communication</a></li>
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-bell me-2"></i>Alerts</a></li>
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-bar-chart-line me-2"></i>Reports</a></li>
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-people me-2"></i>User Management</a></li>
          <li class="nav-item mb-2"><a class="nav-link text-dark" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
        </ul>
      </div>
    </div>
    

    <!-- Main Content -->
    <main class="main-content container">

        <!-- Top bar with input and user info -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="input-group" style="max-width: 500px;">
            <span class="input-group-text bg-white border-end-0 p-1">
              <i class="bi bi-search" style="font-size: 14px;"></i>
            </span>
            <input type="text" class="form-control border-start-0 p-1" placeholder="Search..." style="font-size: 14px; height: 40px;" />
          </div>
  
          <div class="d-flex align-items-center">
            <span class="me-3">Admin User</span>
            <img src="img/notifications.png" alt="Notifications" style="height: 30px; width: 30px;">
            <img src="img/Frame 245.png" alt="Profile" style="height: 30px; width: 30px;" class="ms-2">
          </div>
        </div>
  
        <!-- Heading and create button -->
        <section class="alerts-header-section d-flex flex-wrap justify-content-between align-items-center mb-4">
            <h3 class="mb-2 mb-md-0">Driver Management</h3>
            <div class="buttons d-flex gap-2">
              <button class="btn btn-outline-white border">Assign Driver</button>
              <button class="btn btn-success">+ Add Driver</button>
            </div>
          </section>
          
  
        <!-- Filters and views -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mb-3 px-2 mt-5">
          <div class="input-group" style="max-width: 500px; width: 100%;">
            <span class="input-group-text bg-white border-end-0 p-1">
              <i class="bi bi-search" style="font-size: 14px;"></i>
            </span>
            <input type="text" class="form-control border-start-0 p-1" placeholder="Search..." style="font-size: 14px; height: 40px;" />
          </div>
  
          <div class="d-flex gap-2 mt-2 mt-sm-0">
            <button class="btn btn-outline-secondary btn-sm">Filter</button>
            <button class="btn btn-outline-primary btn-sm">Map View</button>
            <button class="btn btn-outline-dark btn-sm">List View</button>
          </div>
        </div>
  
        <!-- Driver Cards -->
        <div class="row g-4">
          <!-- Repeat this block for each driver -->
          <div class="col-md-4">
            <div class="card shadow border-0">
              <div class="bg-white d-flex align-items-center justify-content-center gap-3 py-4">
                <img src="img/Snapchat-2039894901.jpg" alt="Driver" class="rounded-circle" style="width: 80px; height: 80px;">
                <h6 class="mb-0 align-self-center">John Doe</h6>
              </div>
              <div class="p-3" style="background-color: #fafaf9;">
                <div class="d-flex justify-content-between mb-2">
                  <div><strong>Route:</strong></div>
                  <div>Lagos</div>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <div><strong>Route:</strong></div>
                  <div>Lagos</div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                  <button class="btn btn-white btn-sm border">Details</button>
                  <button class="btn btn-success btn-sm">Assign Task</button>
                </div>
              </div>
            </div>
          </div>
          <!-- More driver cards here -->
          <div class="col-md-4">
            <div class="card shadow border-0">
              <div class="bg-white d-flex align-items-center justify-content-center gap-3 py-4">
                  <img src="img/Snapchat-2039894901.jpg" alt="Driver" class="rounded-circle" style="width: 80px; height: 80px;">
                  <h6 class="mb-0 align-self-center">John Doe</h6>
                </div>
                
              <div class="p-3" style="background-color:  #fafaf9;">
                <div class="d-flex justify-content-between mb-2">
                  <div><strong>Route:</strong></div>
                  <div>Lagos</div>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <div><strong>Route:</strong></div>
                  <div>Lagos</div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                  <button class="btn btn-white btn-sm border">Details</button>
  
                  <button class="btn btn-success btn-sm">Assign Task</button>
  
                </div>
                
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow border-0">
              <div class="bg-white d-flex align-items-center justify-content-center gap-3 py-4">
                  <img src="img/Snapchat-2039894901.jpg" alt="Driver" class="rounded-circle" style="width: 80px; height: 80px;">
                  <h6 class="mb-0 align-self-center">John Doe</h6>
                </div>
                
              <div class="p-3" style="background-color:  #fafaf9;">
                <div class="d-flex justify-content-between mb-2">
                  <div><strong>Route:</strong></div>
                  <div>Lagos</div>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <div><strong>Route:</strong></div>
                  <div>Lagos</div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                  <button class="btn btn-white btn-sm border">Details</button>
  
                  <button class="btn btn-success btn-sm">Assign Task</button>
  
                </div>
                
              </div>
            </div>
          </div>
            
        </div>
  
      </main>
    </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
